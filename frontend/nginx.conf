server {
    listen 80;

    # 前端资源路径
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API请求转发到后端服务
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;

        # 处理流式输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
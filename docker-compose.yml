services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orange
      POSTGRES_PASSWORD: orange123
      POSTGRES_DB: chatgpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orange -d chatgpt"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://orange:orange123@db:5432/chatgpt
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: https://api.renice.cc/v1
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata: